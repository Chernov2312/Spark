map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_host $upstream_host {
    default $http_host;
    ''      $host;
}

log_format spark_access '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                        '$status $body_bytes_sent $request_time';

resolver 127.0.0.11 valid=10s ipv6=off;

upstream spark_backend {
    zone spark_backend 64k;
    server backend:8000 resolve;
}

upstream spark_frontend {
    zone spark_frontend 64k;
    server frontend:5173 resolve;
}

upstream spark_calls {
    zone spark_calls 64k;
    server calls:8002 resolve;
}

server {
    listen 80;
    server_name sparkwork.dpdns.org;
    access_log /var/log/nginx/access.log spark_access;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $upstream_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location ~ ^/[0-9A-Fa-f-]+/ws$ {
        proxy_pass http://spark_backend;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location ~ ^/api/v1(?:/|$) {
        proxy_pass http://spark_backend;

        absolute_redirect off;
        proxy_redirect http://$upstream_host/ /;
        proxy_redirect https://$upstream_host/ /;
    }

    location /v1/calls/ {
        proxy_pass http://spark_calls;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://spark_frontend;
    }
}
