name: spark-test
services:
  redis-test:
    image: redis:7-alpine
    env_file:
      - ${SPARK_TEST_ENV_FILE:-.env.test}
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    entrypoint:
      - /bin/sh
      - -ec
      - |
        umask 077
        mkdir -p /usr/local/etc/redis
        printf 'user default on >%s ~* &* +@all\n' "$$REDIS_PASSWORD" > /usr/local/etc/redis/users.acl
        printf 'user %s on >%s ~* &* +@all\n' "$$REDIS_USER" "$$REDIS_USER_PASSWORD" >> /usr/local/etc/redis/users.acl
        exec redis-server --bind 0.0.0.0 --appendonly yes --appendfsync everysec --aclfile /usr/local/etc/redis/users.acl
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres-test:
    image: postgres:15-alpine
    env_file:
      - ${SPARK_TEST_ENV_FILE:-.env.test}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend-test:
    group_add:
      - "${DOCKER_SOCKET_GID:-0}"
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    environment:
      POSTGRES_HOST: postgres-test
      REDIS_HOST: redis-test
      REDIS_PORT: 6379
    env_file:
      - ${SPARK_TEST_ENV_FILE:-.env.test}
    command: ["sleep", "infinity"]
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  redis_data:
