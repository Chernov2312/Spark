name: deploy
on:
  workflow_run:
    workflows: ["Backend tests"]
    branches: [master]
    types:
      - completed
jobs:
  
  deploy:
    runs-on: ubuntu-latest
    environment: .env
    if: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' }}
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Remote deploy script
        uses: appleboy/ssh-action@v1
        with:
          host: ${{secrets.HOST}}
          username: ${{secrets.HOST_USERNAME}}
          key: ${{secrets.SSH_PRIVATE_KEY}}
          envs: DEPLOY_SHA
          command_timeout: 30m
          script: |
            set -eu
            if [ ! -d  "Spark" ]; then
              git clone git@github.com:Chernov2312/Spark.git
            fi
            cd Spark
            git fetch origin master
            CURRENT_SHA=$(git rev-parse origin/master)
            if [ "$CURRENT_SHA" != "$DEPLOY_SHA" ]; then
              exit 0
            fi;
            git pull origin master
            umask 077
            cat << 'EOF' > .env
              ${{ secrets.ENV_SECRET }}
            EOF
            chmod 600 .env
            docker compose -f docker-compose.prod.yml up --build --wait

