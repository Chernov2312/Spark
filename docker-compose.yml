name: spark
services:
  ollama:
    image: ollama/ollama:0.34.2
    profiles: ["dev", "prod"]
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  ollama-model:
    image: ollama/ollama:0.34.2
    profiles: ["dev", "prod"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/ollama"]
    command: ["pull", "${OLLAMA_MODEL:-qwen3:0.6b}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:15-alpine
    profiles: ["dev", "prod"]
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./logs/database:/var/log/postgresql
    command:
      - postgres
      - -c
      - logging_collector=on
      - -c
      - log_destination=stderr
      - -c
      - log_directory=/var/log/postgresql
      - -c
      - log_filename=database.log
      - -c
      - log_rotation_age=1d
      - -c
      - log_rotation_size=50MB
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    profiles: ["dev", "prod"]
    environment:
      POSTGRES_HOST: postgres
    env_file:
      - .env
    command: ["sh", "-c", "bash ./entrypoint.sh >> /logs/backend.log 2>&1"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama-model:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; exit(0) if urllib.request.urlopen('http://backend:8000/health').getcode() == 200 else exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 5s
    ports:
      - "8001:8000"
    volumes:
      - ./whisper-cache:/home/appuser/.cache/whisper
      - ./backend:/app
      - ./logs:/logs

  frontend:
    build: ./frontend
    profiles: ["dev", "prod"]
    container_name: frontend
    ports:
      - "5174:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ./logs:/logs
    command: ["sh", "-c", "npm install --include=dev --prefer-offline --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173 >> /logs/frontend.log 2>&1"]
    environment:
      CHOKIDAR_USEPOLLING: true
      VITE_API_URL: ${API_BASE_URL:-http://localhost:8001}
    depends_on:
      backend:
        condition: service_healthy
  redis:
    image: redis:latest
    profiles: ["dev", "prod"]
    env_file:
      - .env
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - ./redisdata:/data
      - ./redis.sh:/usr/local/bin/redis.sh:ro
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    entrypoint: ["/bin/sh", "/usr/local/bin/redis.sh"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$$REDIS_PASSWORD", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
  celery:
    build: ./backend
    profiles: ["dev", "prod"]
    environment:
      POSTGRES_HOST: postgres
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - ./whisper-cache:/home/appuser/.cache/whisper
      - ./logs:/logs
    command: celery -A tasks.config_celery.celery_app worker --loglevel=info --logfile=/logs/backend.log --concurrency=1
  celery-beat:
    build: ./backend
    profiles: ["dev", "prod"]
    environment:
      POSTGRES_HOST: postgres
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - ./whisper-cache:/home/appuser/.cache/whisper
      - ./logs:/logs
    command: celery -A tasks.config_celery.celery_app beat --loglevel=info --logfile=/logs/backend.log --schedule=/tmp/celerybeat-schedule
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    profiles: ["prod"]
    restart: always
    ports:
      - "81:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-var:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["prod"]
    env_file:
      - .env
    restart: always
    command: tunnel --no-autoupdate run --token ${TOKEN_TUNNEL}
    depends_on:
      - nginx

volumes:
  postgres_data:
  ollama_data:
  certbot-etc:
  certbot-var:
