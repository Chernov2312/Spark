name: python_test
on:
  push:
    branches:
      - main
      - master

jobs:
  python_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Redis + Postgres
        run: docker compose -f docker-compose.test.yml up --build --exit-code-from backend-test
