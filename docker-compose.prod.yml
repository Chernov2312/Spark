x-logging: &prod-logging
  driver: local
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    ports: !reset []
    volumes: !override
      - postgres_data:/var/lib/postgresql/data
    command: ["postgres", "-c", "log_connections=on", "-c", "log_disconnections=on"]
    logging: *prod-logging

  redis:
    ports: !reset []
    logging: *prod-logging

  backend:
    ports: !reset []
    volumes: !override
      - ./whisper-cache:/home/appuser/.cache/whisper
    environment:
      LOG_TO_STDOUT: "1"
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:?Set OPENAI_BASE_URL in .env}
      OPENAI_MODEL: ${OPENAI_MODEL:?Set OPENAI_MODEL in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
    command: ["bash", "./entrypoint.sh", "--log-level", "warning", "--no-access-log"]
    depends_on: !override
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *prod-logging

  frontend:
    ports: !reset []
    volumes: !reset []
    command: null
    environment:
      VITE_API_URL: ${API_BASE_URL:-/api/v1}
    logging: *prod-logging

  celery:
    volumes: !override
      - ./whisper-cache:/home/appuser/.cache/whisper
    command: celery -A tasks.config_celery.celery_app worker --loglevel=info --concurrency=1
    logging: *prod-logging

  celery-beat:
    volumes: !reset []
    command: celery -A tasks.config_celery.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    logging: *prod-logging

  nginx:
    image: nginx:alpine
    profiles: ["prod"]
    restart: always
    ports:
      - "127.0.0.1:81:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    logging: *prod-logging
