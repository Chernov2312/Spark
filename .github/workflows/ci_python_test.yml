name: python_test
on:
  push:
    branches:
      - main
      - master

jobs:
  python_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true

      - name: Run docker-compose
        run: docker compose --env-file .env.test -f docker-compose.test.yml up --build -d
      
      - name: Api Test
        run: docker compose -f docker-compose.test.yml exec -T backend-test pytest tests/unit
      
      - name: Integration Test
        run: docker compose -f docker-compose.test.yml exec -T backend-test pytest tests/integration
      
      - name: Down
        if: always()
        run: docker compose --env-file .env.test -f docker-compose.test.yml down -v