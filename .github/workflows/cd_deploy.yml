name: deploy
on:
  workflow_run:
    workflows: ["Backend tests"]
    branches: [master]
    types:
      - completed
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: .env
    if: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Remote deploy script
        uses: appleboy/ssh-action@master
        with:
          host: ${{secrets.HOST}}
          username: ${{secrets.HOST_USERNAME}}
          key: ${{secrets.SSH_PRIVATE_KEY}}
          key_path: ""
          script: |
            set -eu
            if [ ! -d  "Spark" ]; then
              git clone git@github.com:Chernov2312/Spark.git
            fi
            cd Spark
            git pull origin master
            umask 077
            cat << 'EOF' > .env
              ${{ secrets.ENV_SECRET }}
            EOF
            chmod 600 .env
            docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile prod up --build --wait
            docker compose --profile dev stop ollama-model ollama

