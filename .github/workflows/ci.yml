name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go_ci:
    uses: ./.github/workflows/ci_go.yml

  lint_test:
    uses: ./.github/workflows/ci_linter_test.yml

  backend_tests:
    uses: ./.github/workflows/ci_python_test.yml

  typescript_ci:
    uses: ./.github/workflows/ci_typescript.yml

  gate:
    needs: [go_ci, lint_test, backend_tests, typescript_ci]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks to succeed
        env:
          GO_RESULT: ${{ needs.go_ci.result }}
          LINT_RESULT: ${{ needs.lint_test.result }}
          PYTHON_RESULT: ${{ needs.backend_tests.result }}
          TYPESCRIPT_RESULT: ${{ needs.typescript_ci.result }}
        run: |
          for result in "$GO_RESULT" "$LINT_RESULT" "$PYTHON_RESULT" "$TYPESCRIPT_RESULT"; do
            if [ "$result" != success ]; then
              echo "CI check did not succeed: $result"
              exit 1
            fi
          done

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    needs: gate

    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate image name
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-backend" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=spark-backend
          cache-to: type=gha,scope=spark-backend,mode=max
          provenance: true
          sbom: true

      - name: Build summary
        run: |
          echo "## Docker image" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: ${{ steps.image.outputs.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: [gate, publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    uses: ./.github/workflows/cd_deploy.yml
    secrets: inherit
