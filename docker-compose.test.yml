name: spark-test
services:
  redis-test:
    image: redis:7-alpine
    env_file:
      - .env.test
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    entrypoint: >
      /bin/sh -c "
      mkdir -p /usr/local/etc/redis &&
      echo 'bind 0.0.0.0' > /usr/local/etc/redis/redis.conf &&
      echo 'appendonly yes' >> /usr/local/etc/redis/redis.conf &&
      echo 'appendfsync everysec' >> /usr/local/etc/redis/redis.conf &&
      echo 'daemonize no' >> /usr/local/etc/redis/redis.conf &&
      echo 'user default on >${REDIS_PASSWORD} ~* &* +@all' > /usr/local/etc/redis/users.acl &&
      echo 'user ${REDIS_USER} on >${REDIS_USER_PASSWORD} ~* &* +@all' >> /usr/local/etc/redis/users.acl &&
      exec redis-server /usr/local/etc/redis/redis.conf --aclfile /usr/local/etc/redis/users.acl
      "
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres-test:
    image: postgres:15-alpine
    env_file:
      - .env.test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend-test:
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    environment:
      POSTGRES_HOST: postgres-test
    env_file:
      - .env.test
    command: ["sleep", "infinity"]
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    volumes:
      - ./backend:/app
    

volumes:
  redis_data:
