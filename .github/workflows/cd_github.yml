name: Spark
on:
  push:
    branches:
      - main
jobs:
  lint_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
        
      - name: Install dependencies
        run: python -m pip install --upgrade pip | python -r install requirements/test.txt
  
      - name: Isort check
        run: isort . --check-only

      - name: Black check
        run: black --check .

      - name: Flake8 check
        run: flake8 .