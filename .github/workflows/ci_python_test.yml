name: python_test
on:
  push:
    branches:
      - main
      - master

jobs:
  python_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run docker-compose
        run: docker compose --env-file .env.test -f docker-compose.test.yml up --build -d
      
      - name: Api Test
        run: docker compose -f docker-compose.yml exec _T backend-test pytest tests/unit
      
      - name: Integration Test
        run: docker compose -f docker-compose.yml exec _T backend-test pytest tests/integration
      
      - name: Down
        if: always()
        run: docker compose --env-file .env.test -f docker-compose.test.yml down -v