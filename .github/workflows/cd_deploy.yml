name: deploy

on:
  workflow_call:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: .env
    concurrency:
      group: spark-production
      cancel-in-progress: false
    env:
      DEPLOY_SHA: ${{ github.sha }}
      ENV_SECRET: ${{ secrets.ENV_SECRET }}
    steps:
      - name: Remote deploy script
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{secrets.HOST}}
          username: ${{secrets.HOST_USERNAME}}
          key: ${{secrets.SSH_PRIVATE_KEY}}
          envs: DEPLOY_SHA,ENV_SECRET
          command_timeout: 30m
          script: |
            set -eu
            if [ ! -d  "Spark" ]; then
              git clone git@github.com:Chernov2312/Spark.git
            fi
            cd Spark
            git fetch origin master
            CURRENT_SHA=$(git rev-parse origin/master)
            if [ "$CURRENT_SHA" != "$DEPLOY_SHA" ]; then
              exit 0
            fi
            git merge --ff-only "$DEPLOY_SHA"
            test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
            umask 077
            printf '%s\n' "$ENV_SECRET" > .env
            chmod 600 .env
            docker compose -f docker-compose.prod.yml up --build --wait

