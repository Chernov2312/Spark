name: Release Spark apps

on:
  push:
    tags: ['apps-v*']

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.version.outputs.name }}
      code: ${{ steps.version.outputs.code }}
    steps:
      - name: Read app version from tag
        id: version
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^apps-v(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})$ ]]; then
            echo 'Use a tag such as apps-v1.0.0.' >&2
            exit 1
          fi
          echo "name=${GITHUB_REF_NAME#apps-v}" >> "$GITHUB_OUTPUT"
          echo "code=$((BASH_REMATCH[1] * 1000000 + BASH_REMATCH[2] * 1000 + BASH_REMATCH[3] + 1))" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        working-directory: clients/desktop
    env:
      SPARK_VERSION: ${{ needs.version.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/desktop/package-lock.json
      - run: npm ci
      - run: npm version --no-git-tag-version --allow-same-version $env:SPARK_VERSION
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: spark-windows
          path: clients/desktop/dist/Spark-Windows-x64.exe
          if-no-files-found: error

  android:
    needs: version
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: clients/android
    env:
      SPARK_ANDROID_VERSION_NAME: ${{ needs.version.outputs.name }}
      SPARK_ANDROID_VERSION_CODE: ${{ needs.version.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build and verify signed APK
        env:
          SPARK_ANDROID_KEYSTORE_BASE64: ${{ secrets.SPARK_ANDROID_KEYSTORE_BASE64 }}
          SPARK_ANDROID_STORE_PASSWORD: ${{ secrets.SPARK_ANDROID_STORE_PASSWORD }}
          SPARK_ANDROID_KEY_ALIAS: ${{ secrets.SPARK_ANDROID_KEY_ALIAS }}
          SPARK_ANDROID_KEY_PASSWORD: ${{ secrets.SPARK_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${SPARK_ANDROID_KEYSTORE_BASE64:?Configure the Android release signing secrets}"
          umask 077
          export SPARK_ANDROID_KEYSTORE="$RUNNER_TEMP/spark-release.p12"
          trap 'rm -f "$SPARK_ANDROID_KEYSTORE"' EXIT
          printf '%s' "$SPARK_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$SPARK_ANDROID_KEYSTORE"
          bash ./gradlew --no-daemon :app:assembleRelease :app:lintRelease
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Spark-Android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: spark-android
          path: ${{ runner.temp }}/Spark-Android.apk
          if-no-files-found: error

  publish:
    needs: [version, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: spark-*
          merge-multiple: true
          path: installers
      - name: Publish installers together
        env:
          GH_TOKEN: ${{ github.token }}
          SPARK_VERSION: ${{ needs.version.outputs.name }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Spark $SPARK_VERSION" --generate-notes \
            installers/Spark-Windows-x64.exe installers/Spark-Android.apk
