name: spark
services:
  postgres:
    image: postgres:15-alpine
    profiles: ["dev"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    profiles: ["dev"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      FROM_EMAIL: ${FROM_EMAIL}
      LOGIN_EMAIL: ${LOGIN_EMAIL}
      PASSWORD_EMAIL: ${PASSWORD_EMAIL}
      YANDEX_CLOUD_KEY_ID: ${YANDEX_CLOUD_KEY_ID}
      YANDEX_CLOUD_KEY: ${YANDEX_CLOUD_KEY}
      BUCKET_NAME: ${BUCKET_NAME}
      API_GEMINI: ${API_GEMINI}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_USER: ${REDIS_USER}
      REDIS_USER_PASSWORD: ${REDIS_USER_PASSWORD}
    command: bash ./entrypoint.sh
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; exit(0) if urllib.request.urlopen('http://localhost:8000/health').getcode() == 200 else exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    profiles: ["dev"]
    container_name: frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=/api/v1
    depends_on:
      backend:
        condition: service_healthy
  redis:
    image: redis:latest
    profiles: ["dev"]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_USER=${REDIS_USER}
      - REDIS_USER_PASSWORD=${REDIS_USER_PASSWORD}
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - ./redisdata:/data
      - ./redis.sh:/usr/local/bin/redis.sh:ro
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    entrypoint: ["/bin/sh", "/usr/local/bin/redis.sh"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$$REDIS_PASSWORD", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
  celery:
    build: ./backend
    profiles: ["dev"]
    volumes:
      - ./backend:/app
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      FROM_EMAIL: ${FROM_EMAIL}
      LOGIN_EMAIL: ${LOGIN_EMAIL}
      PASSWORD_EMAIL: ${PASSWORD_EMAIL}
      YANDEX_CLOUD_KEY_ID: ${YANDEX_CLOUD_KEY_ID}
      YANDEX_CLOUD_KEY: ${YANDEX_CLOUD_KEY}
      BUCKET_NAME: ${BUCKET_NAME}
      API_GEMINI: ${API_GEMINI}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_USER: ${REDIS_USER}
      REDIS_USER_PASSWORD: ${REDIS_USER_PASSWORD}
    command: celery -A tasks.config_celery.celery_app worker --loglevel=info --uid=nobody --concurrency=1
  celery-beat:
    build: ./backend
    profiles: ["dev"]
    volumes:
      - ./backend:/app
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      FROM_EMAIL: ${FROM_EMAIL}
      LOGIN_EMAIL: ${LOGIN_EMAIL}
      PASSWORD_EMAIL: ${PASSWORD_EMAIL}
      YANDEX_CLOUD_KEY_ID: ${YANDEX_CLOUD_KEY_ID}
      YANDEX_CLOUD_KEY: ${YANDEX_CLOUD_KEY}
      BUCKET_NAME: ${BUCKET_NAME}
      API_GEMINI: ${API_GEMINI}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_USER: ${REDIS_USER}
      REDIS_USER_PASSWORD: ${REDIS_USER_PASSWORD}
    command: celery -A tasks.config_celery.celery_app beat --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    profiles: ["prod"]
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-var:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend

  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["prod"]
    environment:
      TOKEN_TUNNEL: ${TOKEN_TUNNEL}
    restart: always
    command: tunnel --no-autoupdate run --token ${TOKEN_TUNNEL}
    depends_on:
      - nginx

volumes:
  postgres_data:
  certbot-etc:
  certbot-var: