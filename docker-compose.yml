name: spark
services:
  postgres:
    image: postgres:15-alpine
    profiles: ["dev"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    profiles: ["dev"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      FROM_EMAIL: ${FROM_EMAIL}
      LOGIN_EMAIL: ${LOGIN_EMAIL}
      PASSWORD_EMAIL: ${PASSWORD_EMAIL}
      YANDEX_CLOUD_KEY_ID: ${YANDEX_CLOUD_KEY_ID}
      YANDEX_CLOUD_KEY: ${YANDEX_CLOUD_KEY}
      BUCKET_NAME: ${BUCKET_NAME}
      API_GEMINI: ${API_GEMINI}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_USER: ${REDIS_USER}
      REDIS_USER_PASSWORD: ${REDIS_USER_PASSWORD}
    command: bash ./entrypoint.sh
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; exit(0) if urllib.request.urlopen('http://localhost:8000/health').getcode() == 200 else exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    profiles: ["dev"]
    container_name: frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=http://localhost:8000/api/v1
    depends_on:
      backend:
        condition: service_healthy
  redis:
    image: redis:latest
    profiles: ["dev"]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_USER=${REDIS_USER}
      - REDIS_USER_PASSWORD=${REDIS_USER_PASSWORD}
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - ./redisdata:/data
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    command: >
      sh -c '
        mkdir -p /usr/local/etc/redis &&
        echo "bind 0.0.0.0" > /usr/local/etc/redis/redis.conf &&
        echo "appendonly yes" >> /usr/local/etc/redis/redis.conf &&
        echo "appendfsync everysec" >> /usr/local/etc/redis/redis.conf &&
        echo "user default on >$$REDIS_PASSWORD ~* &* +@all" > /usr/local/etc/redis/users.acl &&
        echo "user $$REDIS_USER on >$$REDIS_USER_PASSWORD ~* &* +@all" >> /usr/local/etc/redis/users.acl &&

        redis-server /usr/local/etc/redis/redis.conf --aclfile /usr/local/etc/redis/users.acl
      '
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$REDIS_PASSWORD", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
  celery:
    build: ./backend
    profiles: ["dev"]
    volumes:
      - ./backend:/app
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      FROM_EMAIL: ${FROM_EMAIL}
      LOGIN_EMAIL: ${LOGIN_EMAIL}
      PASSWORD_EMAIL: ${PASSWORD_EMAIL}
      YANDEX_CLOUD_KEY_ID: ${YANDEX_CLOUD_KEY_ID}
      YANDEX_CLOUD_KEY: ${YANDEX_CLOUD_KEY}
      BUCKET_NAME: ${BUCKET_NAME}
      API_GEMINI: ${API_GEMINI}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_USER: ${REDIS_USER}
      REDIS_USER_PASSWORD: ${REDIS_USER_PASSWORD}
    command: celery -A worker.sync_db worker --loglevel=info --uid=nobody --concurrency=1
  celery-beat:
    build: ./backend
    profiles: ["dev"]
    volumes:
      - ./backend:/app
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      FROM_EMAIL: ${FROM_EMAIL}
      LOGIN_EMAIL: ${LOGIN_EMAIL}
      PASSWORD_EMAIL: ${PASSWORD_EMAIL}
      YANDEX_CLOUD_KEY_ID: ${YANDEX_CLOUD_KEY_ID}
      YANDEX_CLOUD_KEY: ${YANDEX_CLOUD_KEY}
      BUCKET_NAME: ${BUCKET_NAME}
      API_GEMINI: ${API_GEMINI}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_USER: ${REDIS_USER}
      REDIS_USER_PASSWORD: ${REDIS_USER_PASSWORD}
    command: celery -A worker.sync_db beat --loglevel=info --concurrency=1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    profiles: ["prod"]
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-var:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend

  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["prod"]
    restart: always
    command: tunnel --url http://nginx:80
    depends_on:
      - nginx
  postgres_test:
    image: postgres:15-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}_test
      POSTGRES_USER: ${POSTGRES_USER}_test
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}_test"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  certbot-etc:
  certbot-var: