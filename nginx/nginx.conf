# В http {} (оставляем без изменений)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 81;
    server_name sparkwork.dpdns.org;

    # 1. WebSocket: /{chat_id}/ws
    location ~ ^/(?<chat_id>[0-9a-f-]+)/ws$ {
        # Если бэкенд запущен в Docker, внутри сети Docker порты контейнеров изолированы.
        # Если uvicorn/fastapi внутри контейнера слушает порт 8000 (а наружу проброшен как 8001:8000),
        # то Nginx должен обращаться к порту 8000, а не 8001! 
        proxy_pass http://backend:8000/$chat_id/ws$is_args$args;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering off;
    }

    # 2. REST API
    location /api/v1 {
        # Аналогично: внутри Docker-сети обращаемся к внутреннему порту бэкенда (8000)
        proxy_pass http://backend:8000/api/v1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Фронтенд (Vite)
    location / {
        # Внутри Docker-сети Vite слушает 5174 (как мы видели в логах)
        proxy_pass http://frontend:5174;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
