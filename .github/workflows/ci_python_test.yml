name: Backend tests

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python_test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: backend

    env:
      POSTGRES_DB: spark_test
      POSTGRES_USER: spark_test
      REDIS_USER: default
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen3:0.6b
      YANDEX_CLOUD_KEY_ID: test-only-access-key
      YANDEX_CLOUD_KEY: test-only-secret-key
      BUCKET_NAME: spark-test-bucket
      FROM_EMAIL: test@example.com
      LOGIN_EMAIL: test@example.com
      PASSWORD_EMAIL: test-only-password

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate per-run test credentials
        run: |
          for key in SECRET_KEY POSTGRES_PASSWORD REDIS_PASSWORD REDIS_USER_PASSWORD; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true

      - name: Install FFmpeg
        run: |
          if ! command -v ffmpeg > /dev/null; then
            sudo apt-get update
            sudo apt-get install --yes ffmpeg
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/test.txt

      - name: Run unit and integration tests with coverage
        run: >-
          python -m pytest tests
          --cov=api --cov=core --cov=config
          --cov=db --cov=schemas --cov=tasks --cov=main
          --cov-fail-under=80
          --cov-report=term-missing
          --cov-report=xml:coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  docker_build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    needs: python_test

    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate image name
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-backend" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=spark-backend
          cache-to: type=gha,scope=spark-backend,mode=max
          provenance: true
          sbom: true

      - name: Build summary
        run: |
          echo "## Docker image" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: ${{ steps.image.outputs.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
